name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract project
        shell: bash
        run: |
          set -e
          ARCHIVE="$(find . -type f -iname 'NaghshJahanShare.rar' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: NaghshJahanShare.rar was not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-project"
          7z x "$ARCHIVE" "-o$RUNNER_TEMP/android-project" -y

      - name: Find Android project
        shell: bash
        run: |
          set -e
          PROJECT_ROOT="$(find "$RUNNER_TEMP/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle was not found in the archive"
            find "$RUNNER_TEMP/android-project" -maxdepth 4 -type f
            exit 1
          fi

          echo "ANDROID_PROJECT_ROOT=$(dirname "$PROJECT_ROOT")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_PROJECT_ROOT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaghshJahan-Android-APK
          path: |
            ${{ env.ANDROID_PROJECT_ROOT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
