name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "NaghshJahanShare.rar"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(find . -maxdepth 4 -type f -iname 'NaghshJahanShare.rar' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "::error::NaghshJahanShare.rar not found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-project"
          7z x "$ARCHIVE" "-o$RUNNER_TEMP/android-project" -y

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(find "$RUNNER_TEMP/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Gradle project not found in archive."
            exit 1
          fi

          echo "ANDROID_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Prepare JVM compatibility fix
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/android-jvm-target.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
          }
          GRADLE

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --init-script "$RUNNER_TEMP/android-jvm-target.gradle" assembleDebug
          else
            echo "::error::Gradle wrapper gradlew is missing."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaghshJahan-Android-APK
          path: ${{ env.ANDROID_PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
