
name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -type f -iname 'NaghshJahanShare.rar' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: NaghshJahanShare.rar was not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-project"
          7z x "$ARCHIVE" "-o$RUNNER_TEMP/android-project" -y

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find "$RUNNER_TEMP/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings file was not found"
            find "$RUNNER_TEMP/android-project" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "ANDROID_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/align-jvm-targets.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }

              tasks.configureEach { task ->
                  if (task.class.name.contains('KotlinCompile') && task.hasProperty('kotlinOptions')) {
                      task.kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          GRADLE

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_ROOT"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace --init-script "$RUNNER_TEMP/align-jvm-targets.gradle" assembleDebug
          else
            gradle --no-daemon --stacktrace --init-script "$RUNNER_TEMP/align-jvm-targets.gradle" assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaghshJahan-Android-APK
          path: |
            ${{ env.ANDROID_PROJECT_ROOT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
